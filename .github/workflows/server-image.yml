# Test the song server and publish its container image (spec 005, research R16).
#
# On a push to main that touches the server, the reader it reuses (src/), the catalog it reads or
# the image definition, run the server's tests (with their docstring examples), then build the
# image and push it to ghcr.io/giowgiow/nes-arranger-server with two tags: the commit SHA and
# "main". The homelab deployment pins the image by digest (deploy/homelab/nes-arranger/).
#
# The first push creates the package as private on GitHub. Make it public once (package
# settings -> Change visibility), or give the cluster an image pull secret.

name: Server image

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - "src/**"
      - "arranger/data/catalog/**"
      - "pyproject.toml"
      - "uv.lock"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/server-image.yml"
  workflow_dispatch:

permissions:
  contents: read

# One publish at a time; a newer push waits instead of cancelling one in progress.
concurrency:
  group: server-image
  cancel-in-progress: false

jobs:
  test:
    name: pytest (song server)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.1"
      - name: Run the server tests (fake upstreams, no network)
        run: uv run --frozen pytest tests/server server

  image:
    name: Build and push the image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: COMMIT=${{ github.sha }}
          tags: |
            ghcr.io/giowgiow/nes-arranger-server:${{ github.sha }}
            ghcr.io/giowgiow/nes-arranger-server:main
          cache-from: type=gha
          cache-to: type=gha,mode=max
